version: '3.8'

services:
  backend:
    build:
      context: ./backend
    container_name: pathos_backend
    ports:
      - "8002:8002"
    env_file:
      - ./backend/.env
    restart: always
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
    container_name: pathos_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8002
    depends_on:
      - backend
    restart: always
